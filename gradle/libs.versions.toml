activityCompose = "1.12.3"
ktor = "3.4.0"
hilt = "2.57.1"
kodein = "7.30.0"
decompose = "3.4.0"
essenty = "2.5.0"
navigation3 = "1.0.0"
room = "2.8.4"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
